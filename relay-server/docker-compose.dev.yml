# Desenvolvimento: backend na porta 8787 e Vite (frontend) na 5173, os dois com recarga automática.
# Use a página em http://localhost:5173. A porta 8787 atende a API, os WebSockets e a câmera Android.
# Alterações em backend/src reiniciam o backend; alterações em frontend/ aparecem na página na hora.
# Rebuild (--build) só é preciso ao mudar dependências (package.json) ou os Dockerfile.dev.
services:
  relay:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      # Aberta na rede local para o app Android debug conectar pelo IP do computador.
      - "0.0.0.0:8787:8787"
    environment:
      # O retorno do login com Google passa pelo Vite.
      PUBLIC_URL: http://localhost:5173
      TRUST_PROXY: "0"
      REQUIRE_2FA: "0"
      # Atualização do app: em desenvolvimento, aceita o APK debug (pacote com .debug).
      APP_PACKAGE: br.dev.bizo.cameramonitor.debug
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CLIP_STORAGE_MB: ${CLIP_STORAGE_MB:-}
      OFFLINE_ALERT_MS: ${OFFLINE_ALERT_MS:-}
    volumes:
      # O código vem da pasta local; o nodemon reinicia o servidor a cada alteração.
      - ./backend/src:/app/src
      - relay-data-dev:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      RELAY_HOST: relay
      VITE_HOST: 0.0.0.0
      # A pasta do Windows montada não avisa o Linux das alterações: o Vite confere periodicamente.
      VITE_POLLING: "1"
    volumes:
      # O código do frontend vem da pasta local; as dependências ficam no container.
      - ./frontend:/app
      - /app/node_modules

volumes:
  relay-data-dev:
