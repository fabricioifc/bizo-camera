services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:8787:8787"
    environment:
      PUBLIC_URL: http://localhost:5173
      TRUST_PROXY: "0"
      REQUIRE_2FA: "0"
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - relay-data-dev:/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      RELAY_HOST: relay
      VITE_HOST: 0.0.0.0
    volumes:
      - ./frontend:/app/frontend
      - ./vite.config.js:/app/vite.config.js:ro

volumes:
  relay-data-dev:
