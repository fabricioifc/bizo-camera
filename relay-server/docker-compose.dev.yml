services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:8787:8787"
    environment:
      PUBLIC_URL: http://localhost:8787
      TRUST_PROXY: "0"
      REQUIRE_2FA: "0"
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - relay-data-dev:/data

volumes:
  relay-data-dev:
