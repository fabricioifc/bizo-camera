services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      # Publicado só em localhost: o cloudflared acessa daqui, sem exposição direta à internet.
      - "127.0.0.1:8787:8787"
    environment:
      # Atrás do cloudflared, usa o IP real do cliente (X-Forwarded-For) para limitar tentativas.
      TRUST_PROXY: "1"
      # Só o primeiro usuário pode se cadastrar. Use "1" temporariamente para criar outra conta.
      ALLOW_SIGNUP: "0"
    volumes:
      - relay-data:/data

volumes:
  relay-data:
