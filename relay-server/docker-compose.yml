services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      # Publicado só em localhost: o cloudflared acessa daqui, sem exposição direta à internet.
      - "127.0.0.1:8787:8787"
    environment:
      # Os valores são lidos do .env pelo Docker Compose.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      REQUIRE_2FA: ${REQUIRE_2FA:-1}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Vazias: valem os padrões do servidor (500 MB, 5 minutos, pacote de produção).
      CLIP_STORAGE_MB: ${CLIP_STORAGE_MB:-}
      OFFLINE_ALERT_MS: ${OFFLINE_ALERT_MS:-}
      APP_PACKAGE: ${APP_PACKAGE:-}
    volumes:
      - relay-data:/data

  # Backup do volume de dados: uma cópia ao subir e outra por dia, em BACKUP_DIR (padrão ./backups,
  # fora do git). No Dokploy, que clona o código de novo a cada deploy, use uma pasta fixa do servidor.
  backup:
    image: alpine:3.20
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    environment:
      # Horário no formato do cron, em UTC. "0 6 * * *" = todo dia às 03:00 de Brasília.
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 6 * * *}
      # Quantas cópias guardar; as mais antigas são apagadas.
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - relay-data:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro

  # Restauração (só roda quando chamada): docker compose run --rm restore /backups/<arquivo>
  restore:
    image: alpine:3.20
    profiles: ["restore"]
    entrypoint: ["/bin/sh", "/scripts/restore.sh"]
    volumes:
      - relay-data:/data
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ./scripts:/scripts:ro

volumes:
  relay-data:
    # Nome fixo: o mesmo volume vale rodando daqui (projeto relay-server) ou pelo Dokploy,
    # que usa outro nome de projeto. Sem isso, o Dokploy criaria um volume vazio.
    name: relay-server_relay-data
